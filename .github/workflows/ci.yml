name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One module, one job. GOTOOLCHAIN is local so the job tests the toolchain
  # setup-go resolved rather than letting a `go >= X` directive reach past it
  # for a version that is listed as a module but absent from go.dev — the
  # failure mode that took down a release once with nothing useful in the log.
  check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
